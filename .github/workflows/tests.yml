name: Run Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bank system tests
        run: pytest Questions/bank_system/test_bank_system.py -v

      - name: Run in-memory database tests
        run: pytest Questions/in_memory_database/test_in_memory_database.py -v
